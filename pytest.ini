[pytest]
testpaths = tests stage1/tests stage2/tests stage3/tests stage4/tests
norecursedirs = .git .pytest_cache __pycache__
pythonpath = .
# Data-coupled suites are opt-in: run them with `-m real_index` / `-m needs_corpus`
# (they need the supplied index / DART corpus) or on the self-hosted runner.
addopts = -m "not real_index and not needs_corpus"
markers =
    real_index: requires the supplied chunk_index SQLite/Chroma index and cached E5 model
    needs_corpus: requires the supplied DART corpus (universe.csv + manifest.jsonl); run on the self-hosted runner, skipped by hosted CI
