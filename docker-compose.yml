# dis-164 공시 Agent -- 기본 배포 (STAGE2_MODE=local, 단일 컨테이너).
#
#   INDEX_DIR=/data/local_db docker compose up -d --build
#
# INDEX_DIR 는 호스트의 chunk_index.db + chunk_index_chroma/ 가 있는 디렉터리.
# 없으면 ./data/local_db 를 쓴다. 컨테이너 안에서는 항상 /app/data/local_db (read-only).
#
# Stage2는 제공된 로컬 SQLite·Chroma 인덱스를 read-only로 사용한다.

name: dis164

services:
  app:
    build:
      context: .
    image: dis164-agent:local
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # CLOVA_LLM_ENABLED는 비밀값이 아니라 기능 스위치라 .env(git 비추적) 대신 여기 커밋해
      # 둔다 -- 이 environment: 블록의 값이 env_file: (.env)의 값보다 우선하므로, .env에서
      # 값을 빠뜨리거나 false로 둬도 항상 true로 시작한다.
      CLOVA_LLM_ENABLED: "true"
      STAGE2_MODE: local
      STAGE2_EMBEDDING: e5
      STAGE2_INDEX_PATH: /app/data/local_db/chunk_index.db
      STAGE2_CHROMA_PATH: /app/data/local_db/chunk_index_chroma
      STAGE2_CHROMA_COLLECTION: chunk_vectors
      STAGE2_SQL_TABLE: chunk_index
      STAGE2_ALLOW_PARTIAL_INDEX: "true"
      FASTEMBED_CACHE_DIR: /opt/models/fastembed
    volumes:
      - ${INDEX_DIR:-./data/local_db}:/app/data/local_db:ro
    restart: unless-stopped
    stop_grace_period: 30s
