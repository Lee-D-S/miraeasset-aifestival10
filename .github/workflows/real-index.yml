name: supplied-index-integration

on:
  workflow_dispatch:

jobs:
  real-index:
    runs-on: [self-hosted, Windows, supplied-index]
    env:
      REAL_INDEX_ROOT: ${{ vars.REAL_INDEX_ROOT }}
      REAL_CORPUS_DIR: ${{ github.workspace }}\tests\fixtures\real_index_corpus
      STAGE2_ALLOW_PARTIAL_INDEX: "true"
      CLOVA_LLM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Run supplied-index integration tests
        shell: powershell
        run: python -m pytest -m real_index
      - name: Run read-only index checker
        shell: powershell
        run: python scripts/check_real_index.py --allow-partial-index
